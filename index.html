<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">

<script type="text/babel">
//<![CDATA[
const { useState } = React;

function calcNZ(gross) {
  // NZ PAYE 2025
  const bands = [
    { limit: 15600,   rate: 0.105 },
    { limit: 53500,   rate: 0.175 },
    { limit: 78100,   rate: 0.30  },
    { limit: 180000,  rate: 0.33  },
    { limit: Infinity,rate: 0.39  },
  ];
  let tax = 0, prev = 0;
  for (const b of bands) {
    const slice = Math.min(Math.max(0, gross - prev), b.limit - prev);
    tax += slice * b.rate;
    prev = b.limit;
    if (prev >= gross) break;
  }
  // ACC earner levy 2025: 1.60% up to $142,283
  const accBase = Math.min(gross, 142283);
  const acc = accBase * 0.016;
  const total = tax + acc;
  const takeHome = gross - total;
  return { tax, acc, total, takeHome };
}

function fmt(n) { return 'NZ$' + Math.round(n).toLocaleString('en-NZ'); }
function pct(n, gross) { return gross > 0 ? (n / gross * 100).toFixed(1) + '%' : '0%'; }

function Row({ label, value, gross, highlight }) {
  return (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid #f0f0f0'}}>
      <span style={{fontSize:14,color:highlight?'#1a1a2e':'#6b7280',fontWeight:highlight?700:400}}>{label}</span>
      <div style={{textAlign:'right'}}>
        <span style={{fontSize:15,fontWeight:700,color:highlight?'#0284c7':'#1a1a2e'}}>{fmt(value)}</span>
        <span style={{fontSize:12,color:'#9ca3af',marginLeft:8}}>{pct(value,gross)}</span>
      </div>
    </div>
  );
}

function App() {
  const [gross, setGross] = useState(75000);
  const r = calcNZ(Number(gross) || 0);
  const g = Number(gross) || 0;

  return (
    <div style={{maxWidth:520,margin:'0 auto',padding:'0 0 40px'}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>

      <div style={{background:'linear-gradient(135deg,#0284c7,#0369a1)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🇳🇿</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>New Zealand Income Tax Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>PAYE · ACC Earner Levy — 2025</p>
      </div>

      <div style={{padding:'20px'}}>
        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Annual Gross Salary (NZD)</label>
          <div style={{position:'relative'}}>
            <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280',fontWeight:700}}>NZ$</span>
            <input type="number" value={gross} onChange={e=>setGross(e.target.value)}
              style={{width:'100%',padding:'11px 12px 11px 44px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box',outline:'none'}} />
          </div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#6b7280',marginBottom:4,textTransform:'uppercase',letterSpacing:0.5}}>Take-Home Pay</div>
          <div style={{fontSize:36,fontWeight:900,color:'#0284c7',marginBottom:4}}>{fmt(r.takeHome)}</div>
          <div style={{fontSize:13,color:'#9ca3af'}}>per year &nbsp;·&nbsp; {fmt(r.takeHome/12)} / month &nbsp;·&nbsp; {fmt(r.takeHome/52)} / week</div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          <div style={{fontSize:13,fontWeight:700,color:'#374151',marginBottom:8}}>Breakdown</div>
          <Row label="Gross Salary" value={g} gross={g} />
          <Row label="PAYE Income Tax" value={r.tax} gross={g} />
          <Row label="ACC Earner Levy (1.60%)" value={r.acc} gross={g} />
          <Row label="Total Deductions" value={r.total} gross={g} />
          <Row label="Net Take-Home" value={r.takeHome} gross={g} highlight />
        </div>

        <div style={{background:'#e0f2fe',borderRadius:12,padding:'16px',marginTop:16,fontSize:13,color:'#0369a1',lineHeight:1.6}}>
          <strong>2025 rates:</strong> 10.5% to $15,600 · 17.5% to $53,500 · 30% to $78,100 · 33% to $180,000 · 39% above $180,000. ACC earner levy 1.60% on earnings up to $142,283.
        </div>

        {/* Tax bands table */}
        <div style={{background:'#fff',borderRadius:14,padding:'20px',boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginTop:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#374151',marginBottom:12}}>2025 Tax Bands</div>
          {[['Up to NZ$15,600','10.5%'],['$15,601 – $53,500','17.5%'],['$53,501 – $78,100','30%'],['$78,101 – $180,000','33%'],['Over $180,000','39%']].map(([band,rate])=>(
            <div key={band} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #f0f0f0',fontSize:13}}>
              <span style={{color:'#374151'}}>{band}</span>
              <span style={{fontWeight:700,color:'#0284c7'}}>{rate}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
